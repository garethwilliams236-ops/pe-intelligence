name: crawl

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many targets to crawl"
        required: false
        default: "20"
      mode:
        description: "probe (writes nothing) or crawl"
        required: false
        default: "probe"
  schedule:
    # Sundays 03:17 UTC. Off-peak, and an odd minute so it isn't in a thundering herd.
    - cron: "17 3 * * 0"

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Probe
        if: github.event.inputs.mode == 'probe'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m crawler.run probe --limit ${{ github.event.inputs.limit || 5 }} --any

      - name: Crawl
        if: github.event.inputs.mode != 'probe'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python -m crawler.run crawl \
            --limit ${{ github.event.inputs.limit || 20 }} \
            --triggered-by ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}

      - name: Status
        if: always() && github.event.inputs.mode != 'probe'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m crawler.run status
